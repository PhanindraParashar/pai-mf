[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pai-mf"
version = "0.1.1"
description = "Mutual fund and index data, rolling analysis, and fund scoring"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Phanindra Parashar"}]
keywords = ["mutual funds", "AMFI", "financial analysis", "yfinance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2"]
amfi = ["mftool>=3.3"]
data = ["yfinance>=0.2", "mftool>=3.3"]
plot = ["plotly>=5.18"]
all = ["yfinance>=0.2", "mftool>=3.3", "plotly>=5.18"]

[project.urls]
Documentation = "https://github.com/PhanindraParashar/pai-mf/tree/main/docs"
Issues = "https://github.com/PhanindraParashar/pai-mf/issues"
Repository = "https://github.com/PhanindraParashar/pai-mf"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paimf = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
